
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Amazon</title>
  </head>

  <body>
    <header>
      <div class="navbar">

        <div class="nav-logo border">
          <div class="logo"></div>
        </div>

        <div class="nav-address border">
          <p class="Deliver">Deliver to</p>

          <div class="address-icon">
            <i class="fa-solid fa-location-dot"></i>
            <p class="India">India</p>
            
          </div>
        </div>
        <div class="nav-search">
            <select class="search-select">
                <option>All</option>
                <input placeholder="Search Amazon" class="search-input">

            </select >
            <div class="search-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            
        </div>
        <div class="nav-Signin border">
        <p class="hello">Hello, sign in</p>
        <p class="Accounts">Accounts & Lists</p>
      </div>
      <div class="nav-returns border">
        <p class="hello">Returns</p>
        <p class="Accounts">& Orders</p>
      </div>
        <div class="nav-cart border">
        <i class="fa-solid fa-cart-shopping"></i>
        cart
      </div>

      </div>
      
      
    </header>
  </body>
</html>
